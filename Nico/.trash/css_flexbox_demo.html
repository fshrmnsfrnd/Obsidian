
<style>
.demo-wrap2 { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; background: var(--color-background-primary); margin-bottom: 1rem; }
.flex-stage { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px; min-height: 120px; display: flex; transition: all 0.3s; }
.flex-item { width: 52px; height: 52px; border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; flex-shrink: 0; }
.fi1 { background: var(--color-background-info); color: var(--color-text-info); border: 0.5px solid var(--color-border-info); }
.fi2 { background: var(--color-background-success); color: var(--color-text-success); border: 0.5px solid var(--color-border-success); }
.fi3 { background: var(--color-background-warning); color: var(--color-text-warning); border: 0.5px solid var(--color-border-warning); }
.ctrl-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
.ctrl-label { font-size: 12px; color: var(--color-text-secondary); min-width: 100px; }
select { font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); }
.prop-tag { font-size: 11px; font-family: var(--font-mono); background: var(--color-background-secondary); padding: 2px 6px; border-radius: 4px; color: var(--color-text-secondary); }
</style>

<div class="demo-wrap2">
  <div style="margin-bottom: 12px;">
    <span style="font-size: 14px; font-weight: 500; color: var(--color-text-primary);">flexbox</span>
  </div>

  <div class="ctrl-row">
    <span class="ctrl-label">flex-direction</span>
    <select id="fd" onchange="updateFlex()">
      <option value="row">row</option>
      <option value="row-reverse">row-reverse</option>
      <option value="column">column</option>
      <option value="column-reverse">column-reverse</option>
    </select>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-label">justify-content</span>
    <select id="jc" onchange="updateFlex()">
      <option value="flex-start">flex-start</option>
      <option value="flex-end">flex-end</option>
      <option value="center">center</option>
      <option value="space-between">space-between</option>
      <option value="space-around">space-around</option>
      <option value="space-evenly">space-evenly</option>
    </select>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-label">align-items</span>
    <select id="ai" onchange="updateFlex()">
      <option value="stretch">stretch</option>
      <option value="flex-start">flex-start</option>
      <option value="center">center</option>
      <option value="flex-end">flex-end</option>
    </select>
  </div>
  <div class="ctrl-row">
    <span class="ctrl-label">flex-wrap</span>
    <select id="fw" onchange="updateFlex()">
      <option value="nowrap">nowrap</option>
      <option value="wrap">wrap</option>
    </select>
  </div>

  <div id="flex-stage" class="flex-stage" style="gap: 8px;">
    <div class="flex-item fi1">A</div>
    <div class="flex-item fi2">B</div>
    <div class="flex-item fi3">C</div>
  </div>
  <div style="margin-top: 8px; font-size: 12px; font-family: var(--font-mono); color: var(--color-text-secondary);" id="flex-code"></div>
</div>

<script>
function updateFlex() {
  const s = document.getElementById('flex-stage');
  const fd = document.getElementById('fd').value;
  const jc = document.getElementById('jc').value;
  const ai = document.getElementById('ai').value;
  const fw = document.getElementById('fw').value;
  s.style.flexDirection = fd;
  s.style.justifyContent = jc;
  s.style.alignItems = ai;
  s.style.flexWrap = fw;
  s.style.minHeight = fd.startsWith('column') ? '200px' : '120px';
  document.getElementById('flex-code').textContent =
    `display: flex; flex-direction: ${fd}; justify-content: ${jc}; align-items: ${ai}; flex-wrap: ${fw};`;
}
updateFlex();
</script>
